name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Genera il sito statico
        env:
          # ANTEPRIMA sull'indirizzo provvisorio di GitHub. Quando il dominio è attivo:
          #   SITE_URL: https://larosadeldesertodiseddrack.it   e   BASE_PATH: ""
          SITE_URL: https://carosello75.github.io/larosadeldesertodiseddrack.it
          BASE_PATH: /larosadeldesertodiseddrack.it
          # Quando la campagna Google Ads è pronta, aggiungi questi due valori in
          # Settings > Secrets and variables > Actions > Variables
          GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
          GOOGLE_ADS_CALL_CONVERSION: ${{ vars.GOOGLE_ADS_CALL_CONVERSION }}
        run: python freeze.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
